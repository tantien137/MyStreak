<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Streak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fugaz+One&family=Titan+One&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <video autoplay loop muted playsinline src="assets/images/Background/Afternoon/1.mp4" class="bg_video"></video>
  <div class="btnPanel">
    <div class="timerAndBtn">
      <p id="timer">00:00</p>
      <button id="timerControlBtn">Focus</button>
    </div>
    <div class="debugPanel">
      <button id="clearCacheBtn">Clear cache</button>
      <button id="runTestCode">Run test</button>
      <br>
      <input type="text" id="dateInput" placeholder="dd/mm/yyyy">
      <button id="insertToHistory">Insert to history</button>
    </div>
  </div>
  <div class="statisticsPanel">
    <div class="currentStreak">
      <div class="totalHoursWrapper">
        <p id="totalTime">Total Times Focused: </p>
      </div>
      <div class="streakWrapper">
        <div id="streak">
          <img src="assets/images/StreakGif.gif" id="streakFire">
        </div>
        <div id="streakRecords">
          <h1 id="totalStreak">1000 WEEKS</h1>
        </div>
      </div>
      <p id="hoursNeeded"></p>
    </div>
    <div id="lowerStaticsPanel">
      <div id="notesPanel">
        
      </div>
      <div id="history">

     </div>
    </div>
  </div>
  <script src="assets/js/main.js"></script>
</body>
</html>
